<!DOCTYPE html>
<html lang="es" class="h-full bg-zinc-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Force Gym - Acceso al Sistema</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full bg-zinc-900 text-zinc-100 flex items-center justify-center p-4 font-sans antialiased">

  <div class="w-full max-w-md bg-zinc-800/50 border border-zinc-800 rounded-xl shadow-2xl p-8">
    
    <!-- Encabezado con Logotipo Oficial -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 mb-4 rounded-full bg-black border-2 border-yellow-400 p-1 shadow-lg shadow-yellow-400/10">
        <img src="/img/logo.png" alt="Infinite Force Gym" class="w-full h-full object-contain rounded-full">
      </div>
      <h1 class="text-2xl font-extrabold tracking-wider text-white uppercase">
        Infinite <span class="text-yellow-400">Force</span> Gym
      </h1>
      <p class="text-xs text-zinc-400 mt-1 uppercase tracking-widest font-semibold">
        Control de Acceso y Gestión Centralizada
      </p>
    </div>

    <!-- Mensaje de Notificacion de Error -->
    <div id="errorAlert" class="hidden mb-6 p-4 rounded-xl bg-red-950/80 border border-red-800 text-red-200 text-xs font-semibold">
      <span id="errorMessage">Credenciales invalidas. Intente nuevamente.</span>
    </div>

    <!-- Formulario de Inicio de Sesion -->
    <form id="loginForm" action="/login" method="POST" class="space-y-5">
      <div>
        <label for="email" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">
          Correo Electrónico
        </label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="username"
          placeholder="usuario@infiniteforce.com"
          class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 text-sm focus:outline-none focus:border-yellow-400 focus:ring-1 focus:ring-yellow-400 transition"
        >
      </div>

      <div>
        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-zinc-300 mb-2">
          Contraseña
        </label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          placeholder="Ingrese su clave"
          class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 text-sm focus:outline-none focus:border-yellow-400 focus:ring-1 focus:ring-yellow-400 transition"
        >
      </div>

      <div class="pt-2">
        <button
          type="submit"
          id="submitButton"
          class="w-full py-3.5 px-4 bg-yellow-400 hover:bg-yellow-300 text-zinc-950 font-bold uppercase tracking-wider text-xs rounded-xl shadow-lg shadow-yellow-400/10 transition-all duration-150 active:scale-95"
        >
          Iniciar Sesión
        </button>
      </div>
    </form>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const errorParam = urlParams.get('error');
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');

      if (errorParam) {
        if (errorParam === 'credenciales_invalidas') {
          errorMessage.textContent = 'Credenciales inválidas. Verifique su correo y contraseña.';
        } else if (errorParam === 'campos_requeridos') {
          errorMessage.textContent = 'Por favor complete todos los campos requeridos.';
        } else {
          errorMessage.textContent = 'Ocurrió un error al validar su sesión. Intente nuevamente.';
        }
        errorAlert.classList.remove('hidden');
      }

      const form = document.getElementById('loginForm');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const submitButton = document.getElementById('submitButton');

        if (!email || !password.trim()) {
          errorMessage.textContent = 'Debe ingresar su correo y contraseña sin espacios vacíos.';
          errorAlert.classList.remove('hidden');
          return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          errorMessage.textContent = 'El formato del correo electrónico no es válido.';
          errorAlert.classList.remove('hidden');
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Iniciando sesión...';
        errorAlert.classList.add('hidden');

        try {
          const response = await fetch('/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });

          const data = await response.json();

          if (response.ok && data.success && data.redirectUrl) {
            window.location.href = data.redirectUrl;
          } else {
            errorMessage.textContent = data.message || 'Credenciales inválidas.';
            errorAlert.classList.remove('hidden');
            submitButton.disabled = false;
            submitButton.textContent = 'Iniciar Sesión';
          }
        } catch (networkError) {
          form.submit();
        }
      });
    });
  </script>
</body>
</html>
